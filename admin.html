<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMIN — CROCINI 관리자</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <header class="admin-header">
    <div class="admin-header-inner">
      <h1 class="admin-logo">CROCINI <span>ADMIN</span></h1>
      <nav class="admin-nav">
        <a href="#products" class="active">상품 관리</a>
        <a href="#custom-orders">주문제작</a>
        <a href="#inquiries">문의 관리</a>
        <a href="index.html" target="_blank">사이트 보기 ↗</a>
      </nav>
    </div>
  </header>

  <main class="admin-main">

    <!-- ============================================================
         상품 관리
         ============================================================ -->
    <section class="admin-section" id="products">
      <div class="admin-section-header">
        <h2>상품 관리</h2>
        <button type="button" class="btn-primary" id="btnNewProduct">+ 새 상품 등록</button>
      </div>

      <div class="admin-toolbar">
        <select id="filterCategory">
          <option value="">전체 카테고리</option>
          <option value="crocodile">CROCODILE</option>
          <option value="ostrich">OSTRICH</option>
          <option value="python">PYTHON</option>
        </select>
        <span class="admin-count" id="productCount">0 개</span>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width: 60px;">ID</th>
              <th style="width: 80px;">이미지</th>
              <th>이름</th>
              <th style="width: 120px;">카테고리</th>
              <th style="width: 140px;">가격</th>
              <th style="width: 120px;">뱃지</th>
              <th style="width: 140px;">관리</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <tr><td colspan="7" class="admin-loading">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ============================================================
         주문제작 관리 (Python 전용)
         ============================================================ -->
    <section class="admin-section" id="custom-orders">
      <div class="admin-section-header">
        <h2>주문제작 관리</h2>
        <button type="button" class="btn-secondary" id="btnRefreshCustomOrders">새로고침</button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width: 60px;">ID</th>
              <th style="width: 100px;">상태</th>
              <th style="width: 100px;">모델</th>
              <th style="width: 110px;">이름</th>
              <th style="width: 130px;">연락처</th>
              <th style="width: 200px;">옵션</th>
              <th>요청사항</th>
              <th style="width: 140px;">접수일시</th>
            </tr>
          </thead>
          <tbody id="customOrderTableBody">
            <tr><td colspan="8" class="admin-loading">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ============================================================
         문의 관리
         ============================================================ -->
    <section class="admin-section" id="inquiries">
      <div class="admin-section-header">
        <h2>문의 관리</h2>
        <button type="button" class="btn-secondary" id="btnRefreshInquiries">새로고침</button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width: 60px;">ID</th>
              <th style="width: 100px;">상태</th>
              <th style="width: 120px;">이름</th>
              <th style="width: 150px;">연락처</th>
              <th style="width: 200px;">이메일</th>
              <th>문의 내용</th>
              <th style="width: 160px;">접수 일시</th>
            </tr>
          </thead>
          <tbody id="inquiryTableBody">
            <tr><td colspan="7" class="admin-loading">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- ============================================================
       상품 등록/수정 모달
       ============================================================ -->
  <div class="modal-overlay" id="productModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">새 상품 등록</h3>
        <button type="button" class="modal-close" id="modalClose">×</button>
      </div>

      <form class="modal-body" id="productForm" enctype="multipart/form-data" novalidate>
        <input type="hidden" name="id" id="productId" />

        <div class="form-row">
          <label class="form-field">
            <span>이름 <em>*</em></span>
            <input type="text" name="name" id="fName" maxlength="255" required />
          </label>
          <label class="form-field">
            <span>카테고리 <em>*</em></span>
            <select name="category" id="fCategory" required>
              <option value="crocodile">CROCODILE</option>
              <option value="ostrich">OSTRICH</option>
              <option value="python">PYTHON</option>
            </select>
          </label>
        </div>

        <label class="form-field">
          <span>옵션 설명</span>
          <input type="text" name="option_desc" id="fOptionDesc" maxlength="255" placeholder="예: 1마리 / 스트랩겸용" />
        </label>

        <div class="form-row">
          <label class="form-field">
            <span>판매가 (원)</span>
            <input type="number" name="price" id="fPrice" min="0" placeholder="비우면 '주문제작 문의' 표시" />
          </label>
          <label class="form-field">
            <span>정가 (원)</span>
            <input type="number" name="original_price" id="fOriginalPrice" min="0" placeholder="할인 없으면 비움" />
          </label>
        </div>

        <div class="form-row">
          <label class="form-field">
            <span>뱃지</span>
            <input type="text" name="badge" id="fBadge" maxlength="100" placeholder="예: SIGNATURE / 주문제작 / MADE TO ORDER" />
          </label>
          <label class="form-field">
            <span>주문제작 여부</span>
            <select name="is_custom_order" id="fCustomOrder">
              <option value="0">일반 상품</option>
              <option value="1">주문제작</option>
            </select>
          </label>
        </div>

        <div class="form-field">
          <span>상품 이미지</span>
          <div class="image-upload-area">
            <img id="fImagePreview" alt="" />
            <div class="image-upload-controls">
              <input type="file" name="image" id="fImageFile" accept="image/jpeg,image/png,image/webp" />
              <p class="form-hint">JPG/PNG/WebP, 최대 10MB</p>
              <details>
                <summary>또는 외부 URL 사용</summary>
                <input type="url" name="image_url" id="fImageUrl" placeholder="https://..." />
              </details>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <p class="form-status" id="formStatus" hidden></p>
          <div class="modal-actions">
            <button type="button" class="btn-ghost" id="btnCancel">취소</button>
            <button type="submit" class="btn-primary" id="btnSubmit">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
