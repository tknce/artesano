<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOP — CROCINI 아르테사노</title>
  <meta
    name="description"
    content="CROCINI 컬렉션 — 40년 장인의 손으로 완성한 크로커다일, 오스트리치, 파이톤 핸드백."
  />
  <meta name="keywords" content="CROCINI shop, 가죽 핸드백, 크로커다일 백, 오스트리치 백, 파이톤 백, 럭셔리 가죽" />
  <meta name="theme-color" content="#1a1a1a" />

  <link rel="canonical" href="https://www.crocini.co.kr/shop" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="CROCINI 아르테사노" />
  <meta property="og:title"       content="SHOP — CROCINI 컬렉션" />
  <meta property="og:description" content="40년 장인의 손으로 완성한 크로커다일, 오스트리치, 파이톤 핸드백 컬렉션." />
  <meta property="og:image"       content="https://www.crocini.co.kr/images/hero-main.jpg" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url"         content="https://www.crocini.co.kr/shop" />
  <meta property="og:locale"      content="ko_KR" />

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="SHOP — CROCINI 컬렉션" />
  <meta name="twitter:description" content="40년 장인의 손으로 완성한 크로커다일, 오스트리치, 파이톤 핸드백." />
  <meta name="twitter:image"       content="https://www.crocini.co.kr/images/hero-main.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="analytics.js" defer></script>
</head>

<!-- body 에 .shop-page 클래스 추가:
     이 클래스가 있으면 네비바가 항상 밝은 톤(크림 배경)으로 표시됨 -->
<body class="shop-page">

  <!--#NAV#-->


  <!-- ==========================================================
       페이지 헤더 — 큰 타이포 + 짧은 카피
       ========================================================== -->
  <section class="shop-header">
    <div class="container">
      <p class="section-eyebrow">CROCINI COLLECTION</p>
      <h1 class="shop-title">The Collection</h1>
      <p class="shop-subtitle">
        한 점 한 점, 40년 장인의 손에서 완성된 한정 컬렉션.<br />
        세 가지 시그니처 가죽으로 만나보세요.
      </p>
    </div>
  </section>


  <!-- ==========================================================
       필터 탭 — ALL + 카테고리 버튼 (script.js가 /categories에서 동적 생성)
       검색 + 정렬 컨트롤
       ========================================================== -->
  <section class="filter-section">
    <div class="container">
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-btn active" data-filter="all">ALL</button>
      </div>
      <div class="shop-controls">
        <input type="search" id="shopSearch" class="shop-search" placeholder="상품명 검색" autocomplete="off" />
        <select id="shopSort" class="shop-sort">
          <option value="latest">최신순</option>
          <option value="price-asc">가격 낮은순</option>
          <option value="price-desc">가격 높은순</option>
          <option value="name">이름순</option>
        </select>
      </div>
    </div>
  </section>


  <!-- ==========================================================
       제품 그리드
       - 카드는 script.js에서 API 호출 후 동적으로 생성됨
       ========================================================== -->
  <section class="products">
    <div class="container">

      <!-- 로딩 상태: API 응답 전에 표시 -->
      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <p>상품을 불러오는 중...</p>
      </div>

      <!-- 에러 상태: 서버 연결 실패 시 표시 -->
      <div class="error-state" id="errorState" hidden>
        <p class="error-title">서버에 연결할 수 없습니다.</p>
        <p class="error-desc">백엔드 서버가 실행 중인지 확인해주세요.<br /><code>cd backend → npm run dev</code></p>
      </div>

      <!-- 상품 그리드: JS가 여기에 카드를 채워 넣음 -->
      <div class="product-grid" id="productGrid">
        <!-- 상품 카드는 script.js의 fetch()가 여기에 동적으로 삽입 -->

      </div>

      <!-- 필터 결과 없을 때 메시지 -->
      <p class="empty-message" id="emptyMessage" hidden>
        해당 카테고리의 제품이 준비 중입니다.
      </p>
    </div>
  </section>


  <!--#FOOTER#-->

  <script src="script.js"></script>
</body>
</html>
