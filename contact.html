<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CROCINI — Contact</title>
  <meta name="description" content="CROCINI 아르테사노 — 서울 아틀리에 방문 예약 및 제품 문의." />
  <link rel="canonical" href="https://www.crocini.co.kr/contact" />
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="CROCINI 아르테사노" />
  <meta property="og:title"       content="CROCINI — Contact" />
  <meta property="og:description" content="서울 아틀리에 방문 예약 및 제품 문의." />
  <meta property="og:image"       content="https://www.crocini.co.kr/images/hero-main.jpg" />
  <meta property="og:url"         content="https://www.crocini.co.kr/contact" />
  <meta property="og:locale"      content="ko_KR" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:image"       content="https://www.crocini.co.kr/images/hero-main.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="analytics.js" defer></script>
</head>
<body>

  <!--#NAV#-->

  <main>

    <section class="m-section m-contact-page">
      <p class="m-label">ATELIER SEOUL</p>
      <p class="m-serif-lg"><em>찾아오세요.</em></p>
      <p class="m-body">
        서울특별시 송파구 법원로11길 7<br />
        070-8875-0028 · 010-8708-3261<br />
        연중무휴 24시간
      </p>
      <div class="m-contact-links">
        <a href="https://pf.kakao.com/_artesano" target="_blank" rel="noopener" class="m-contact-btn">KakaoTalk</a>
      </div>
    </section>

    <section class="m-section m-form" id="inquiry-form">
      <p class="m-label">INQUIRY</p>
      <p class="m-serif-lg"><em>문의는 아래로 남겨주세요.</em></p>
      <p class="m-body">정성껏 답변드리겠습니다.</p>
      <form class="inquiry-form" id="inquiryForm" novalidate>
        <div class="inquiry-row">
          <label class="inquiry-field">
            <span class="inquiry-label">이름 <em>*</em></span>
            <input type="text" name="name" maxlength="100" required />
          </label>
          <label class="inquiry-field">
            <span class="inquiry-label">연락처 <em>*</em></span>
            <input type="tel" name="phone" maxlength="50" placeholder="010-0000-0000" required />
          </label>
        </div>
        <label class="inquiry-field">
          <span class="inquiry-label">이메일</span>
          <input type="email" name="email" maxlength="255" placeholder="(선택)" />
        </label>
        <label class="inquiry-field">
          <span class="inquiry-label">문의 내용 <em>*</em></span>
          <textarea name="message" rows="5" required placeholder="문의하실 내용을 자세히 적어주세요."></textarea>
        </label>
        <div class="inquiry-submit-row">
          <p class="inquiry-status" id="inquiryStatus" hidden></p>
          <button type="submit" class="btn-line" id="inquirySubmit">문의하기</button>
        </div>
      </form>
    </section>

  </main>

  <!--#FOOTER#-->

  <script src="script.js"></script>
</body>
</html>
