<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CROCINI 관리자 로그인</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <h1 class="admin-logo">CROCINI <span>ADMIN</span></h1>
      <p>관리자 전용 페이지입니다.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-field">
        <span>아이디</span>
        <input type="text" id="loginUser" autocomplete="username" required />
      </div>
      <div class="form-field" style="margin-top:16px;">
        <span>비밀번호</span>
        <input type="password" id="loginPass" autocomplete="current-password" required />
      </div>
      <p class="login-error" id="loginError" hidden></p>
      <button type="submit" class="btn-primary login-btn" id="loginBtn">로그인</button>
    </form>
  </div>

  <script>
    // 이미 로그인 상태면 바로 관리자 페이지로
    fetch('/api/admin/check').then(r => { if (r.ok) location.replace('/admin.html'); });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      btn.disabled = true;
      btn.textContent = '로그인 중...';
      errEl.hidden = true;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUser').value,
            password: document.getElementById('loginPass').value,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          location.replace('/admin');
        } else {
          errEl.textContent = data.error || '로그인에 실패했습니다.';
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = '로그인';
        }
      } catch {
        errEl.textContent = '서버에 연결할 수 없습니다.';
        errEl.hidden = false;
        btn.disabled = false;
        btn.textContent = '로그인';
      }
    });
  </script>

</body>
</html>
