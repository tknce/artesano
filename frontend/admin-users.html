<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- <link rel="icon" href="/favicon.svg" type="image/svg+xml"> -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>crocini</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    .users-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; padding: 24px; }
    @media (max-width: 980px) { .users-layout { grid-template-columns: 1fr; } }
    .users-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .users-search { display: flex; gap: 8px; margin-bottom: 16px; }
    .users-search input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 14px; }
    .users-search button { padding: 10px 16px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 14px; }
    .users-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .users-table th, .users-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    .users-table th { font-weight: 600; color: var(--muted); }
    .users-table tbody tr { cursor: pointer; }
    .users-table tbody tr:hover { background: #fafafa; }
    .users-table tbody tr.selected { background: #f0f0f0; }
    .badge-blocked { display: inline-block; padding: 2px 8px; background: #fde8e8; color: var(--danger); border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-type { display: inline-block; padding: 2px 8px; background: #eef; color: #335; border-radius: 4px; font-size: 11px; }
    .pager { display: flex; justify-content: center; gap: 4px; margin-top: 16px; }
    .pager button { padding: 6px 10px; border: 1px solid var(--border); background: #fff; border-radius: 4px; font-size: 13px; }
    .pager button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
    .detail-empty { color: var(--muted); text-align: center; padding: 40px 0; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .detail-row span:first-child { color: var(--muted); }
    .detail-row span:last-child { font-weight: 500; }
    .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    .detail-actions button { padding: 8px 14px; border: 1px solid var(--border); background: #fff; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .detail-actions button.danger { color: var(--danger); border-color: var(--danger); }
    .detail-actions button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .order-history { margin-top: 20px; }
    .order-history h4 { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .order-history table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .order-history th, .order-history td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: left; }
    .total-spent { background: #fffaf0; border: 1px solid #f0e0c0; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 14px; }
    .total-spent strong { color: var(--gold); font-size: 18px; }
  </style>
</head>
<body style="visibility:hidden">

  <header class="admin-header">
    <div class="admin-header-inner">
      <h1 class="admin-logo"><a href="/" style="color:inherit;text-decoration:none">CROCINI <span>ADMIN</span></a></h1>
      <nav class="admin-nav">
        <a href="/admin">← 메인 관리</a>
        <span style="color:var(--text);font-weight:600;">회원 관리</span>
        <button type="button" id="btnLogout" class="btn-logout">로그아웃</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="users-layout">
      <div class="users-card">
        <div class="users-search">
          <input type="search" id="searchInput" placeholder="이메일 또는 이름 검색" />
          <button type="button" id="searchBtn">검색</button>
        </div>
        <table class="users-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>이메일</th>
              <th>이름</th>
              <th>가입경로</th>
              <th>가입일</th>
              <th>주문</th>
              <th>누적결제</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="usersTbody">
            <tr><td colspan="8" style="text-align:center;color:var(--muted);padding:40px 0;">불러오는 중…</td></tr>
          </tbody>
        </table>
        <div class="pager" id="pager"></div>
      </div>

      <div class="users-card" id="detailCard">
        <div class="detail-empty">왼쪽에서 회원을 선택하세요.</div>
      </div>
    </div>
  </main>

  <script src="admin-users.js"></script>
</body>
</html>
