<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>crocini</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="analytics.js" defer></script>
</head>
<body class="shop-page" style="visibility:hidden">

  <!--#NAV#-->

  <main class="checkout-wrap">
    <div class="container">
      <!-- 결제 단계 표시 -->
      <div class="checkout-steps" aria-label="결제 진행 단계">
        <span class="checkout-step active">1. 정보 입력</span>
        <span class="checkout-step-arrow">→</span>
        <span class="checkout-step">2. 결제</span>
        <span class="checkout-step-arrow">→</span>
        <span class="checkout-step">3. 완료</span>
      </div>

      <p class="section-eyebrow">CHECKOUT</p>
      <h1 class="checkout-title">결제하기</h1>

      <div class="checkout-grid">

        <!-- 좌측: 주문 정보 입력 -->
        <section class="checkout-form-section">
          <h2 class="checkout-section-title">주문자 / 배송 정보</h2>

          <form id="checkoutForm" novalidate>
            <div class="checkout-field">
              <label>이름 <em>*</em></label>
              <input type="text" name="customerName" id="cName" required maxlength="100" />
            </div>
            <div class="checkout-field">
              <label>연락처 <em>*</em></label>
              <input type="tel" name="customerPhone" id="cPhone" required maxlength="13" placeholder="010-0000-0000" inputmode="numeric" autocomplete="tel" />
              <p class="field-error" id="cPhoneErr" hidden></p>
            </div>
            <div class="checkout-field">
              <label>이메일 <em>*</em></label>
              <input type="email" name="customerEmail" id="cEmail" required maxlength="255" placeholder="real@example.com" autocomplete="email" />
              <p class="field-error" id="cEmailErr" hidden></p>
            </div>

            <div class="checkout-field">
              <label>우편번호 <em>*</em></label>
              <div class="postal-row">
                <input type="text" name="shippingPostal" id="cPostal" maxlength="20" placeholder="00000" readonly />
                <button type="button" class="postal-btn" id="postalBtn">우편번호 찾기</button>
              </div>
            </div>
            <div class="checkout-field">
              <label>주소 <em>*</em></label>
              <input type="text" name="shippingAddress1" id="cAddress1" required maxlength="255" readonly />
            </div>
            <div class="checkout-field">
              <label>상세 주소</label>
              <input type="text" name="shippingAddress2" id="cAddress2" maxlength="255" />
            </div>
            <div class="checkout-field">
              <label>요청사항</label>
              <textarea name="shippingRequest" id="cRequest" rows="3" maxlength="500" placeholder="배송 시 요청사항을 입력해주세요."></textarea>
            </div>
          </form>
        </section>

        <!-- 우측: 주문 요약 + 결제 -->
        <aside class="checkout-summary">
          <h2 class="checkout-section-title">주문 요약</h2>

          <div class="checkout-product" id="checkoutProduct">
            <div class="loading-spinner"></div>
          </div>

          <div class="checkout-amount-row">
            <span>상품 금액</span>
            <span id="amountProduct">—</span>
          </div>
          <div class="checkout-amount-row">
            <span>배송비</span>
            <span>무료</span>
          </div>

          <!-- 쿠폰 -->
          <div class="checkout-coupon">
            <div class="coupon-input-row">
              <input type="text" id="couponCode" placeholder="쿠폰 코드 입력" maxlength="30" />
              <button type="button" id="couponApplyBtn">적용</button>
            </div>
            <p class="coupon-result" id="couponResult" hidden></p>
          </div>

          <div class="checkout-amount-row discount" id="discountRow" hidden>
            <span>쿠폰 할인</span>
            <span id="amountDiscount">—</span>
          </div>

          <div class="checkout-amount-row total">
            <span>총 결제 금액</span>
            <span id="amountTotal">—</span>
          </div>

          <div id="payment-method"></div>
          <div id="agreement"></div>

          <button type="button" class="checkout-pay-btn" id="payBtn" disabled>결제하기</button>
          <p class="checkout-error" id="checkoutError" hidden></p>
          <p style="font-size:11px;color:#999;text-align:center;margin-top:14px;line-height:1.6;">
            결제를 진행하면 <a href="/terms" target="_blank" rel="noopener" style="color:#999;text-decoration:underline;">이용약관</a> 및
            <a href="/privacy" target="_blank" rel="noopener" style="color:#999;text-decoration:underline;">개인정보 처리방침</a>에 동의한 것으로 간주됩니다.
          </p>
        </aside>

      </div>
    </div>
  </main>

  <!--#FOOTER#-->

  <script>
    const TOSS_CLIENT_KEY = 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';

    // --- 입력 형식 검증 헬퍼 ---
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const PHONE_RE = /^(010|011|016|017|018|019)\d{7,8}$/;
    function formatPhone(v) {
      const d = v.replace(/\D/g, '').slice(0, 11);
      if (d.length < 4) return d;
      if (d.length < 8) return `${d.slice(0,3)}-${d.slice(3)}`;
      return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
    }
    function showFieldError(id, msg) {
      const el = document.getElementById(id);
      if (msg) { el.textContent = msg; el.hidden = false; } else { el.hidden = true; }
    }

    // 휴대폰 자동 하이픈
    document.addEventListener('DOMContentLoaded', () => {
      const phone = document.getElementById('cPhone');
      const email = document.getElementById('cEmail');
      phone.addEventListener('input', () => { phone.value = formatPhone(phone.value); });
      phone.addEventListener('blur', () => {
        const ok = !phone.value || PHONE_RE.test(phone.value.replace(/\D/g, ''));
        showFieldError('cPhoneErr', ok ? null : '올바른 휴대폰 번호 형식이 아닙니다.');
      });
      email.addEventListener('blur', () => {
        const ok = !email.value || EMAIL_RE.test(email.value.trim());
        showFieldError('cEmailErr', ok ? null : '올바른 이메일 형식이 아닙니다.');
      });
    });

    // 결제 시스템 활성화 플래그 — 토스 가맹점 계약 후 true로 변경
    const PAYMENT_ENABLED = false;

    (async () => {
      // 결제 비활성 상태: 안내 화면으로 대체 (토스 위젯 init 안 함)
      if (!PAYMENT_ENABLED) {
        const grid = document.querySelector('.checkout-grid');
        if (grid) grid.style.display = 'none';
        const steps = document.querySelector('.checkout-steps');
        if (steps) steps.style.display = 'none';
        const title = document.querySelector('.checkout-title');
        if (title) title.textContent = '주문 안내';
        const main = document.querySelector('.checkout-wrap .container');
        if (main) {
          const notice = document.createElement('div');
          notice.style.cssText = 'max-width:520px;margin:40px auto;padding:40px 30px;border:1px solid #eee;text-align:center;background:#fff;';
          notice.innerHTML = `
            <p style="margin:0 0 14px;font-size:15px;color:#666;line-height:1.7;">현재 결제 시스템 준비 중입니다.<br/>아래 채널로 주문 문의 부탁드립니다.</p>
            <div style="display:flex;flex-direction:column;gap:10px;text-align:left;border-top:1px solid #eee;padding-top:20px;margin-top:20px;">
              <a href="https://instagram.com/crocini_official_kr" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #eee;color:#222;text-decoration:none;font-size:14px;"><span style="font-size:18px;">📷</span><span>인스타그램 DM <strong>@crocini_official_kr</strong></span></a>
              <a href="tel:010-5891-3321" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #eee;color:#222;text-decoration:none;font-size:14px;"><span style="font-size:18px;">📞</span><span>전화 <strong>010-5891-3321</strong></span></a>
              <a href="mailto:crocini88@gmail.com" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #eee;color:#222;text-decoration:none;font-size:14px;"><span style="font-size:18px;">✉️</span><span>이메일 <strong>crocini88@gmail.com</strong></span></a>
            </div>
            <a href="/shop" style="display:inline-block;margin-top:24px;padding:10px 30px;background:#222;color:#fff;text-decoration:none;font-size:13px;letter-spacing:1px;">쇼핑 계속하기</a>`;
          main.appendChild(notice);
        }
        document.body.style.visibility = '';
        return;
      }

      const params = new URLSearchParams(location.search);
      const productId = params.get('id');
      const fromCart = params.get('from') === 'cart';
      if (!productId && !fromCart) { location.replace('/shop'); return; }

      // 로그인 체크
      const meRes = await fetch('/api/auth/me');
      if (!meRes.ok) { location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search)); return; }
      const me = await meRes.json();

      // 자동 입력
      document.getElementById('cName').value  = me.name  || '';
      document.getElementById('cPhone').value = me.phone || '';
      const isSyntheticEmail = (em) => /^kakao_\d+@crocini\.co\.kr$/.test(em || '') || /^naver_\d+@crocini\.co\.kr$/.test(em || '');
      document.getElementById('cEmail').value = isSyntheticEmail(me.email) ? '' : (me.email || '');

      // 상품 정보
      let product, cartItems = [], totalPrice = 0;

      if (fromCart) {
        // 장바구니 모드
        const cartRes = await fetch('/api/cart');
        cartItems = await cartRes.json();
        if (!cartItems.length) { location.replace('/cart'); return; }
        totalPrice = cartItems.reduce((sum, i) => sum + (i.price || 0) * i.quantity, 0);
        const fmt = n => Number(n).toLocaleString('ko-KR') + '원';
        document.getElementById('checkoutProduct').innerHTML = cartItems.map(i =>
          `<div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.05);">
            <img src="${i.image_url || ''}" alt="${i.name}" style="width:50px;height:50px;object-fit:contain;flex-shrink:0;" />
            <div style="flex:1;min-width:0;">
              <p class="checkout-product-name" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${i.name}</p>
              <p style="font-size:12px;color:#888">${i.option_desc || ''} × ${i.quantity}</p>
            </div>
            <span style="font-size:14px;font-weight:500;white-space:nowrap;">${fmt(i.price * i.quantity)}</span>
          </div>`
        ).join('');
        document.getElementById('amountProduct').textContent = fmt(totalPrice);
        document.getElementById('amountTotal').textContent = fmt(totalPrice);
        product = { price: totalPrice, name: cartItems.map(i => i.name).join(', ') };
      } else {
        // 단일 상품 모드
        try {
          const r = await fetch(`/products/${productId}`);
          if (!r.ok) throw new Error();
          product = await r.json();
        } catch (_) {
          location.replace('/shop');
          return;
        }

        if (product.price === null) {
        // 주문제작은 결제 불가
        location.replace(`/product?id=${productId}`);
        return;
      }

      if (product.stock === 0) {
        alert('품절된 상품입니다.');
        location.replace(`/product?id=${productId}`);
        return;
      }

      const fmt = n => Number(n).toLocaleString('ko-KR') + '원';

      document.getElementById('checkoutProduct').innerHTML = `
        <img src="${product.image_url || ''}" alt="${product.name}" />
        <div>
          <p class="checkout-product-cat">${(product.category || '').toUpperCase()}</p>
          <p class="checkout-product-name">${product.name}</p>
          <p class="checkout-product-opt">${product.option_desc || ''}</p>
        </div>
      `;
      document.getElementById('amountProduct').textContent = fmt(product.price);
      document.getElementById('amountTotal').textContent   = fmt(product.price);
      totalPrice = product.price;
      } // end single product mode

      let appliedDiscount = 0;
      let appliedCouponCode = null;

      // 쿠폰 적용
      document.getElementById('couponApplyBtn').addEventListener('click', async () => {
        const code = document.getElementById('couponCode').value.trim();
        const resultEl = document.getElementById('couponResult');
        if (!code) { resultEl.textContent = '코드를 입력해주세요'; resultEl.className = 'coupon-result error'; resultEl.hidden = false; return; }
        const res = await fetch('/api/coupons/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, orderAmount: totalPrice }),
        });
        const data = await res.json();
        if (!res.ok) { resultEl.textContent = data.error; resultEl.className = 'coupon-result error'; resultEl.hidden = false; return; }
        appliedDiscount = data.discount;
        appliedCouponCode = code.toUpperCase();
        resultEl.textContent = `${fmt(data.discount)} 할인 적용됨`;
        resultEl.className = 'coupon-result success';
        resultEl.hidden = false;
        document.getElementById('discountRow').hidden = false;
        document.getElementById('amountDiscount').textContent = `-${fmt(data.discount)}`;
        document.getElementById('amountTotal').textContent = fmt(totalPrice - appliedDiscount);
        // 토스 위젯에 변경된 결제 금액 반영 (안 하면 풀가 청구됨)
        if (window.__widgets) await window.__widgets.setAmount({ currency: 'KRW', value: totalPrice - appliedDiscount });
      });

      document.body.style.visibility = '';

      // 다음 우편번호 찾기
      document.getElementById('postalBtn').addEventListener('click', () => {
        new daum.Postcode({
          oncomplete: (data) => {
            document.getElementById('cPostal').value   = data.zonecode;
            document.getElementById('cAddress1').value = data.roadAddress || data.jibunAddress;
            document.getElementById('cAddress2').focus();
          },
        }).open();
      });

      // 토스 결제위젯 v2 — 렌더링이 완료될 때까지 await
      try {
      const customerKey = `user_${me.id}`;
      const tossPayments = TossPayments(TOSS_CLIENT_KEY);
      const widgets = tossPayments.widgets({ customerKey });
      window.__widgets = widgets; // 쿠폰 적용 시 setAmount 재호출용

      await widgets.setAmount({ currency: 'KRW', value: totalPrice });

      await Promise.all([
        widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' }),
        widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' }),
      ]);

      const payBtn = document.getElementById('payBtn');
      payBtn.disabled = false;

      payBtn.addEventListener('click', async () => {
        const errEl = document.getElementById('checkoutError');
        errEl.hidden = true;

        // 폼 검증
        const customerName     = document.getElementById('cName').value.trim();
        const customerPhone    = document.getElementById('cPhone').value.trim();
        const customerEmail    = document.getElementById('cEmail').value.trim();
        const shippingPostal   = document.getElementById('cPostal').value.trim();
        const shippingAddress1 = document.getElementById('cAddress1').value.trim();
        const shippingAddress2 = document.getElementById('cAddress2').value.trim();
        const shippingRequest  = document.getElementById('cRequest').value.trim();

        if (!customerName || !customerPhone || !customerEmail || !shippingAddress1) {
          errEl.textContent = '이름, 연락처, 이메일, 주소는 필수입니다.';
          errEl.hidden = false;
          return;
        }
        if (!PHONE_RE.test(customerPhone.replace(/\D/g, ''))) {
          showFieldError('cPhoneErr', '올바른 휴대폰 번호 형식이 아닙니다.');
          document.getElementById('cPhone').focus();
          return;
        }
        if (!EMAIL_RE.test(customerEmail)) {
          showFieldError('cEmailErr', '올바른 이메일 형식이 아닙니다.');
          document.getElementById('cEmail').focus();
          return;
        }

        payBtn.disabled = true;
        payBtn.textContent = '주문 생성 중...';

        // 1) 서버에 pending 주문 생성
        let order;
        try {
          const r = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              productId: fromCart ? null : productId,
              fromCart,
              couponCode: appliedCouponCode,
              customerName, customerPhone, customerEmail,
              shippingPostal, shippingAddress1, shippingAddress2, shippingRequest,
            }),
          });
          order = await r.json();
          if (!r.ok) throw new Error(order.error || '주문 생성 실패');
          // 서버가 최종 검증한 금액으로 위젯 재동기화
          await widgets.setAmount({ currency: 'KRW', value: order.amount });
        } catch (err) {
          errEl.textContent = err.message;
          errEl.hidden = false;
          payBtn.disabled = false;
          payBtn.textContent = '결제하기';
          return;
        }

        // 2) 토스 결제위젯 호출 (v2)
        try {
          await widgets.requestPayment({
            orderId:      order.orderId,
            orderName:    order.productName,
            customerName,
            customerEmail: customerEmail || undefined,
            successUrl:   location.origin + '/payment-success',
            failUrl:      location.origin + '/payment-fail',
          });
        } catch (err) {
          // 위젯 취소/실패 → 서버에 주문 포기 알림 (재고 즉시 복구)
          fetch('/api/orders/abandon', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId: order.orderId }),
          }).catch(() => {});
          errEl.textContent = err.message || '결제가 취소되었습니다.';
          errEl.hidden = false;
          payBtn.disabled = false;
          payBtn.textContent = '결제하기';
        }
      });
      } catch (widgetErr) {
        const errEl = document.getElementById('checkoutError');
        errEl.textContent = '결제 모듈을 불러올 수 없습니다. 페이지를 새로고침해주세요.';
        errEl.hidden = false;
      }
    })();
  </script>
</body>
</html>
