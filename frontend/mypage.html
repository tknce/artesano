<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 — CROCINI 아르테사노</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="shop-page" style="visibility:hidden">

  <!--#NAV#-->

  <div class="mypage-wrap">

    <div class="mypage-greeting">
      <p class="eyebrow">MEMBER</p>
      <h1 id="greetingName">안녕하세요.</h1>
      <button class="mypage-logout-btn" id="logoutBtn" style="margin-top:20px;">로그아웃</button>
    </div>

    <!-- 주문 내역 -->
    <section class="mypage-section">
      <p class="mypage-section-title">주문 내역</p>
      <div class="order-table-wrap">
        <table class="mypage-table" id="ordersPaidTable">
          <thead>
            <tr>
              <th>주문번호</th>
              <th>상품</th>
              <th>금액</th>
              <th>상태</th>
              <th>주문일</th>
            </tr>
          </thead>
          <tbody id="ordersPaidTbody">
            <tr class="empty-row"><td colspan="5">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 찜 목록 -->
    <section class="mypage-section">
      <p class="mypage-section-title">찜 목록</p>
      <div class="wishlist-grid" id="wishlistGrid">
        <p class="wishlist-empty">불러오는 중...</p>
      </div>
    </section>

    <!-- 문의 내역 -->
    <section class="mypage-section">
      <p class="mypage-section-title">문의 내역</p>
      <table class="mypage-table" id="inquiriesTable">
        <thead>
          <tr>
            <th>날짜</th>
            <th>내용</th>
            <th>이메일</th>
          </tr>
        </thead>
        <tbody id="inquiriesTbody">
          <tr class="empty-row"><td colspan="3">불러오는 중...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- 커스텀 주문 내역 -->
    <section class="mypage-section">
      <p class="mypage-section-title">주문제작 신청 내역</p>
      <table class="mypage-table" id="ordersTable">
        <thead>
          <tr>
            <th>날짜</th>
            <th>상품</th>
            <th>가죽 색상</th>
            <th>금장/은장</th>
            <th>예산</th>
          </tr>
        </thead>
        <tbody id="ordersTbody">
          <tr class="empty-row"><td colspan="5">불러오는 중...</td></tr>
        </tbody>
      </table>
    </section>

  </div>

  <!--#FOOTER#-->

  <script>
    function fmt(dateStr) {
      return new Date(dateStr).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function init() {
      const meRes = await fetch('/api/auth/me');
      if (!meRes.ok) { location.replace('/login'); return; }
      const me = await meRes.json();

      document.body.style.visibility = '';
      document.getElementById('greetingName').textContent = `안녕하세요, ${me.name}님.`;

      // 주문 내역
      function fmtPriceFull(p) { return Number(p).toLocaleString('ko-KR') + '원'; }
      const STATUS_LABEL = {
        pending: '결제대기', paid: '결제완료', preparing: '배송준비',
        shipping: '배송중', delivered: '배송완료',
        failed: '실패', cancelled: '취소',
      };
      const CARRIERS_TRACK = {
        cj:     { name: 'CJ대한통운', url: t => `https://www.cjlogistics.com/ko/tool/parcel/tracking?gnbInvcNo=${t}` },
        hanjin: { name: '한진택배',   url: t => `https://www.hanjin.com/kor/CMS/DeliveryMgr/WaybillResult.do?mCode=MN038&schLang=KR&wblnumText2=${t}` },
        lotte:  { name: '롯데택배',   url: t => `https://www.lotteglogis.com/home/reservation/tracking/linkView?InvNo=${t}` },
        epost:  { name: '우체국택배', url: t => `https://service.epost.go.kr/trace.RetrieveDomRigiTraceList.comm?sid1=${t}` },
        logen:  { name: '로젠택배',   url: t => `https://www.ilogen.com/web/personal/trace/${t}` },
      };
      const opRes  = await fetch('/api/orders/mine');
      const opData = await opRes.json();
      const opTbody = document.getElementById('ordersPaidTbody');
      if (!Array.isArray(opData) || opData.length === 0) {
        opTbody.innerHTML = '<tr class="empty-row"><td colspan="5"><div class="empty-state"><div class="empty-state-icon">📦</div><p class="empty-state-title">주문 내역이 없습니다</p><p class="empty-state-desc">마음에 드는 상품을 찾아보세요</p><a href="/shop" class="empty-state-btn">쇼핑하러 가기</a></div></td></tr>';
      } else {
        opTbody.innerHTML = opData.map(o => {
          let trackingHtml = '';
          if (o.tracking_number && o.shipping_carrier && CARRIERS_TRACK[o.shipping_carrier]) {
            const carrier = CARRIERS_TRACK[o.shipping_carrier];
            trackingHtml = `<br /><a href="${carrier.url(o.tracking_number)}" target="_blank" rel="noopener" style="font-size:11px;color:var(--color-gold);">${carrier.name} ${escHtml(o.tracking_number)} ↗</a>`;
          }
          // 주문 타임라인
          const steps = ['paid','preparing','shipping','delivered'];
          const stepLabels = ['결제완료','준비중','배송중','배송완료'];
          const currentIdx = steps.indexOf(o.status);
          const timelineHtml = (currentIdx >= 0) ? `
            <div class="order-timeline">
              ${steps.map((s, i) => {
                const cls = i < currentIdx ? 'completed' : i === currentIdx ? 'active' : '';
                const line = i < steps.length - 1 ? `<div class="timeline-line${i < currentIdx ? ' completed' : ''}"></div>` : '';
                return `<div class="timeline-step ${cls}"><div class="timeline-dot"></div><span class="timeline-label">${stepLabels[i]}</span></div>${line}`;
              }).join('')}
            </div>` : '';
          return `
            <tr>
              <td><code style="font-size:11px;color:#888">${escHtml(o.order_id)}</code></td>
              <td>
                <div style="display:flex;gap:10px;align-items:center;">
                  ${o.product_image_url ? `<img src="${escHtml(o.product_image_url)}" class="mypage-order-img" alt="" />` : ''}
                  <span>${escHtml(o.product_name)}</span>
                </div>
              </td>
              <td>${fmtPriceFull(o.amount)}</td>
              <td>
                <span class="order-status ${o.status}">${STATUS_LABEL[o.status] || o.status}</span>
                ${timelineHtml}
                ${trackingHtml}
              </td>
              <td>${fmt(o.created_at)}</td>
            </tr>
          `;
        }).join('');
      }

      // 찜 목록
      const wRes  = await fetch('/api/wishlist');
      const wData = await wRes.json();
      const wGrid = document.getElementById('wishlistGrid');
      if (!Array.isArray(wData) || wData.length === 0) {
        wGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">♥</div><p class="empty-state-title">찜한 상품이 없습니다</p><p class="empty-state-desc">마음에 드는 상품의 하트를 눌러보세요</p><a href="/shop" class="empty-state-btn">컬렉션 보기</a></div>';
      } else {
        function fmtPrice(p) { return Number(p).toLocaleString('ko-KR') + '원'; }
        wGrid.innerHTML = wData.map(p => `
          <a href="/product?id=${p.id}" class="wishlist-card">
            <div class="wishlist-card-img">
              <img src="${escHtml(p.image_url || '')}" alt="${escHtml(p.name)}" loading="lazy" />
            </div>
            <p class="wishlist-card-name">${escHtml(p.name)}</p>
            <p class="wishlist-card-price">${p.price === null ? '주문제작 문의' : fmtPrice(p.price)}</p>
          </a>
        `).join('');
      }

      // 문의 내역
      const iRes  = await fetch('/api/user/inquiries');
      const iData = await iRes.json();
      const iTbody = document.getElementById('inquiriesTbody');
      if (!Array.isArray(iData) || iData.length === 0) {
        iTbody.innerHTML = '<tr class="empty-row"><td colspan="3">문의 내역이 없습니다.</td></tr>';
      } else {
        iTbody.innerHTML = iData.map(r => `
          <tr>
            <td>${fmt(r.created_at)}</td>
            <td><div class="mypage-msg-preview">${escHtml(r.message)}</div></td>
            <td>${escHtml(r.email ?? '—')}</td>
          </tr>
        `).join('');
      }

      // 커스텀 주문 내역
      const oRes  = await fetch('/api/user/custom-orders');
      const oData = await oRes.json();
      const oTbody = document.getElementById('ordersTbody');
      if (!Array.isArray(oData) || oData.length === 0) {
        oTbody.innerHTML = '<tr class="empty-row"><td colspan="5">주문제작 신청 내역이 없습니다.</td></tr>';
      } else {
        oTbody.innerHTML = oData.map(r => `
          <tr>
            <td>${fmt(r.created_at)}</td>
            <td>${escHtml(r.product_name ?? r.product_code ?? '—')}</td>
            <td>${escHtml(r.leather_color ?? '—')}</td>
            <td>${escHtml(r.hardware ?? '—')}</td>
            <td>${escHtml(r.budget_range ?? '—')}</td>
          </tr>
        `).join('');
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.replace('/');
    });

    init();
  </script>

</body>
</html>
