<!-- 주문 안내 모달 (결제 시스템 준비 중) -->
<div id="orderInquiryModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;width:100%;max-width:440px;padding:36px 30px;border-radius:4px;text-align:center;">
    <h3 style="margin:0 0 12px;font-size:22px;font-weight:600;letter-spacing:1px;">주문 안내</h3>
    <p style="margin:0 0 24px;font-size:14px;color:#666;line-height:1.7;">현재 결제 시스템 준비 중입니다.<br/>아래 채널로 주문 문의 부탁드립니다.</p>
    <div style="display:flex;flex-direction:column;gap:10px;text-align:left;border-top:1px solid #eee;padding-top:20px;">
      <a href="https://instagram.com/crocini_official_kr" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #eee;color:#222;text-decoration:none;font-size:14px;">
        <span style="font-size:18px;">📷</span><span>인스타그램 DM <strong>@crocini_official_kr</strong></span>
      </a>
      <a href="tel:010-5891-3321" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #eee;color:#222;text-decoration:none;font-size:14px;">
        <span style="font-size:18px;">📞</span><span>전화 <strong>010-5891-3321</strong></span>
      </a>
      <a href="mailto:crocini88@gmail.com" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #eee;color:#222;text-decoration:none;font-size:14px;">
        <span style="font-size:18px;">✉️</span><span>이메일 <strong>crocini88@gmail.com</strong></span>
      </a>
    </div>
    <button type="button" id="orderInquiryCloseBtn" style="margin-top:24px;padding:10px 30px;background:#222;color:#fff;border:none;cursor:pointer;font-size:13px;letter-spacing:1px;">닫기</button>
  </div>
</div>
<script>
(() => {
  const navbar    = document.getElementById('navbar');
  const hamburger = document.getElementById('hamburger');
  const navMenu   = document.getElementById('navMenu');
  const navRight  = document.getElementById('navRight');
  const navOverlay = document.getElementById('navOverlay');
  if (!navbar || !hamburger || !navMenu) return;
  function closeMenu() {
    navMenu.classList.remove('open');
    navOverlay && navOverlay.classList.remove('open');
    hamburger.classList.remove('is-open');
    hamburger.setAttribute('aria-expanded', 'false');
  }

  // active 링크 표시 (현재 경로 기반) — nav-menu + nav-right 모두 적용
  const seg = location.pathname.replace(/^\//, '').split('?')[0].split('/')[0];
  document.querySelectorAll(`[data-nav="${seg}"]`).forEach(el => el.classList.add('active'));

  // 햄버거 토글
  hamburger.addEventListener('click', () => {
    const open = !navMenu.classList.contains('open');
    if (open) {
      navMenu.classList.add('open');
      navOverlay && navOverlay.classList.add('open');
      hamburger.classList.add('is-open');
      hamburger.setAttribute('aria-expanded', 'true');
      hamburger.setAttribute('aria-label', '메뉴 닫기');
    } else {
      closeMenu();
      hamburger.setAttribute('aria-label', '메뉴 열기');
    }
  });
  navMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
  navOverlay && navOverlay.addEventListener('click', closeMenu);
  const navClose = document.getElementById('navClose');
  navClose && navClose.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && navMenu.classList.contains('open')) closeMenu();
  });

  // 스크롤 — 맨 위에서는 투명, 내려가면 .scrolled 톤 적용
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 50);
  }, { passive: true });

  // 주문 안내 모달 헬퍼 (결제 비활성 상태에서 사용)
  window.showOrderInquiryModal = () => {
    const m = document.getElementById('orderInquiryModal');
    if (m) m.style.display = 'flex';
  };
  const inquiryClose = document.getElementById('orderInquiryCloseBtn');
  if (inquiryClose) inquiryClose.addEventListener('click', () => {
    document.getElementById('orderInquiryModal').style.display = 'none';
  });

  // 로그인 상태 표시 (마이페이지 또는 로그인) — nav-right에 삽입
  fetch('/api/auth/me').then(async r => {
    const a = document.createElement('a');
    a.className = 'nav-auth-link';
    if (r.ok) {
      const { name } = await r.json();
      a.href = '/mypage';
      a.textContent = name;
      fetch('/api/cart/count').then(r => r.json()).then(({ count }) => {
        const badge = document.getElementById('cartBadge');
        if (badge && count > 0) { badge.textContent = count; badge.hidden = false; }
      }).catch(() => {});
    } else {
      a.href = '/login';
      a.textContent = '로그인';
    }
    navRight.appendChild(a);
  }).catch(() => {});
})();
</script>
