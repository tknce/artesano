<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — CROCINI 아르테사노</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <p class="auth-logo">CROCINI <span>ARTESANO</span></p>
    <p class="auth-subtitle">회원 로그인</p>

    <form id="loginForm" novalidate>
      <div class="auth-field">
        <label for="email">이메일</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="auth-field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <p class="auth-error" id="errMsg" hidden></p>
      <button type="submit" class="auth-btn" id="submitBtn">로그인</button>
    </form>

    <p class="auth-link">계정이 없으신가요? <a href="/register">회원가입</a></p>
    <p class="auth-link" style="margin-top:8px;"><a href="/">홈으로</a></p>
  </div>

  <script>
    // 이미 로그인 상태면 마이페이지로
    fetch('/api/auth/me').then(r => { if (r.ok) location.replace('/mypage'); });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn    = document.getElementById('submitBtn');
      const errEl  = document.getElementById('errMsg');
      btn.disabled = true;
      btn.textContent = '로그인 중...';
      errEl.hidden = true;

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          location.replace('/mypage');
        } else {
          errEl.textContent = data.error || '로그인에 실패했습니다.';
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = '로그인';
        }
      } catch {
        errEl.textContent = '서버에 연결할 수 없습니다.';
        errEl.hidden = false;
        btn.disabled = false;
        btn.textContent = '로그인';
      }
    });
  </script>

</body>
</html>
